<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Collection - Mùa Xuân</title>
  <link rel="stylesheet" href="music_info.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Overpass+Mono:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body.page-enter { opacity: 0; }
    body.page-enter.loaded { opacity: 1; transition: opacity 600ms ease; }
    html, body { margin: 0; padding: 0; background: #fff; overflow-x: hidden; }
    .slide-16-9-music-selection { transform-origin: top left; }
  </style>
</head>
<body>
<script>
  // trigger page enter fade on load
  document.addEventListener('DOMContentLoaded', function(){
    document.body.classList.add('page-enter');
    setTimeout(function(){ document.body.classList.add('loaded'); }, 20);
  });
</script>
<div class="slide-16-9-music-selection">
  <img class="rectangle-9" src="rectangle-90.svg" />
  <div class="ellipse-12"></div>
  <div class="rectangle-15"></div>
  <div class="youtube-widget-by-feat-paper">
    <div
      class="s-ng-t-c-b-i-nh-c-s-ph-m-nh-ch-ng-d-c-bi-u-di-n-l-n-u-b-i-n-danh-ca-th-i-thanh-nh-ng-ph-i-nghe-b-n-thu-c-a-nh-qu-nh-th-ta-m-i-c-m-th-y-linh-h-n-c-a-b-i-h-t-tung-bay-m-t-ca-kh-c-tr-n-nh-a-s-ng-ng-i-ca-m-a-xu-n-c-ng-t-nh-y-u-ng-t-ng-o-m-ch-i"
    >
      Sáng tác bởi nhạc sĩ Phạm Đình Chương, dù được biểu diễn lần đầu bởi nữ
      danh ca Thái Thanh, nhưng phải nghe bản thu của Như Quỳnh thì ta mới cảm
      thấy linh hồn của bài hát tung bay: một ca khúc tràn nhựa sống, ngợi ca
      mùa xuân cùng tình yêu ngọt ngào đâm chồi.
    </div>
  </div>
  <img class="rectangle-16" src="rectangle-160.png" />
</div>
<script>
(function(){
  var BASE_W=1920, BASE_H=1080;
  function rescale(){
    var el=document.querySelector('.slide-16-9-music-selection'); if(!el) return;
    var s=window.innerWidth/BASE_W;
    el.style.transform='scale('+s+')';
    el.style.width=BASE_W+'px'; el.style.height=BASE_H+'px';
    document.body.style.width=Math.ceil(BASE_W*s)+'px';
    document.body.style.height=Math.ceil(BASE_H*s)+'px';
  }
  window.addEventListener('resize', rescale);
  window.addEventListener('DOMContentLoaded', rescale);
  rescale();
})();
</script>
</body>
</html>
