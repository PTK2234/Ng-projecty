<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Landing Page</title>
	   <link rel="stylesheet" href="music_page_play.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Overpass+Mono:wght@300;400;700&display=swap" rel="stylesheet">
	<style>
	  /* Page transition: fade in on load, fade out on navigate */
	  body.page-enter { opacity: 0; }
	  body.page-enter.loaded { opacity: 1; transition: opacity 600ms ease; }
	  body.page-exit { opacity: 0; transition: opacity 600ms ease; }
	  html, body { margin: 0; padding: 0; background: #fff; overflow-x: hidden; }
	  .slide-16-9-music-page { transform-origin: top left; }
	</style>
</head>
<body>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // trigger page enter animation
            document.body.classList.add('page-enter');
            setTimeout(function(){ document.body.classList.add('loaded'); document.body.classList.remove('page-exit'); }, 20);
        });
    </script>
<div class="slide-16-9-music-page">

  <button class="track-btn" aria-label="Play Đón xuân" data-id="track-1" data-embed="https://www.youtube.com/embed/bmYoQ2e9Spc?si=BvKIi_H-ImhqCPaQ" data-lrc="lyrics/don_xuan.lrc">

    <img class="music6" src="Assest/music5.svg" />

</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const embedDisplay = document.getElementById('embed-display');
  if(!embedDisplay) return;
  const panel = embedDisplay.querySelector('.embed-panel');
  const placeholder = embedDisplay.querySelector('.placeholder-img');

    // cleanup function to clear previous player, intervals and handlers
    function cleanupPrevious(){
      try{ if(window._lyricInterval){ clearInterval(window._lyricInterval); window._lyricInterval = null; } }catch(e){}
      try{ if(window._ytPlayer){ window._ytPlayer.destroy(); window._ytPlayer = null; } }catch(e){}
      try{ if(window._trackKeyHandler){ document.removeEventListener('keydown', window._trackKeyHandler); window._trackKeyHandler = null; } }catch(e){}
      try{ const ld = document.getElementById('lyric-display'); if(ld) ld.innerHTML = ''; }catch(e){}
      // clear embed panel content
      try{ panel.innerHTML = ''; }catch(e){}
    }

  
        // central track loader to avoid duplicate handlers/conflicts
        async function loadTrack(btn){
          if(!btn) return;
          // mark current track early
          window._currentTrackBtn = btn;
          // cleanup previous state
          cleanupPrevious();

          const embed = btn.getAttribute('data-embed') || '';
          const isYouTube = /youtube\.com\/embed|youtu\.be/.test(embed);
          panel.setAttribute('aria-hidden', 'false');
          if(!embed){ panel.textContent = 'No embed available for this track.'; return; }

          if(placeholder) placeholder.style.display = 'none';

          const iframe = document.createElement('iframe');
          iframe.className = 'embed-iframe';

          // lyric synchronization helper
          let currentLyricIndex = -1;
          function updateLyricForTime(nowSec){
            if(!lyricLines || lyricLines.length===0) return;
            let i = lyricLines.length-1;
            for(let j=0;j<lyricLines.length;j++){
              if(nowSec < lyricLines[j].time){ i = Math.max(0,j-1); break; }
              if(j===lyricLines.length-1) i = lyricLines.length-1;
            }
            if(i !== currentLyricIndex){
              const list = lyricDisplay.querySelectorAll('.lyric-line');
              if(list[currentLyricIndex]) list[currentLyricIndex].classList.remove('current');
              if(list[i]){ list[i].classList.add('current'); list[i].scrollIntoView({behavior:'smooth',block:'center'}); }
              currentLyricIndex = i;
            }
          }

          // initialize start
          let currentStart = 0;
          const ds = btn.getAttribute('data-start');
          if(ds){ const n = parseInt(ds,10); if(!isNaN(n) && n>0) currentStart = n; }

          function buildSrc(baseEmbed, startSec){
            const isYT = /youtube\.com\/embed|youtu\.be/.test(baseEmbed);
            try{
              const u = new URL(baseEmbed);
              u.searchParams.set('autoplay','1'); if(isYT) u.searchParams.set('enablejsapi','1');
              if(startSec && startSec>0) u.searchParams.set('start', String(Math.floor(startSec))); else u.searchParams.delete('start');
              return u.toString();
            }catch(e){ const parts = baseEmbed.split('?'); const base = parts[0]; const params = new URLSearchParams(parts[1]||''); params.set('autoplay','1'); if(isYT) params.set('enablejsapi','1'); if(startSec && startSec>0) params.set('start', String(Math.floor(startSec))); else params.delete('start'); return base + '?' + params.toString(); }
          }

          iframe.src = buildSrc(embed, currentStart);
          iframe.setAttribute('frameborder','0'); iframe.setAttribute('allow','autoplay; encrypted-media'); iframe.setAttribute('allowfullscreen','');
          panel.appendChild(iframe);

          // render lyrics
          const lyricDisplay = document.getElementById('lyric-display');
          let lyricLines = [];
          let lyricStartRef = Date.now();
          if(lyricDisplay){
            lyricDisplay.innerHTML = '';
            let raw = '';
            const lrcPath = btn.getAttribute('data-lrc');
            if(lrcPath){ try{ const resp = await fetch(lrcPath); if(resp.ok) raw = await resp.text(); }catch(e){} }
            if(!raw) raw = btn.getAttribute('data-lyrics') || btn.getAttribute('data-lyric') || '';
            if(raw){
              function parseLRC(text){ const lines = text.split(/\r?\n/).filter(Boolean); const out = []; const re = /\[(\d+):(\d+(?:\.\d+)?)\](.*)/; for(const l of lines){ const m = l.match(re); if(m){ const mm = parseInt(m[1],10)||0; const ss = parseFloat(m[2])||0; const t = mm*60 + ss; out.push({time:t,text:m[3].trim()}); } else if(l.trim()){ out.push({time:0,text:l.trim()}); } } out.sort((a,b)=>a.time-b.time); return out; }
              lyricLines = parseLRC(raw);
              if(lyricLines.length>0){ const ul = document.createElement('ul'); ul.className='lyric-list'; lyricLines.forEach((ln)=>{ const li = document.createElement('li'); li.className='lyric-line'; li.setAttribute('data-time', String(ln.time)); const mm = String(Math.floor(ln.time/60)).padStart(2,'0'); const ss = String(Math.floor(ln.time%60)).padStart(2,'0'); li.innerHTML = `<span class="time">${mm}:${ss}</span><span class="text">${ln.text}</span>`; ul.appendChild(li); }); lyricDisplay.appendChild(ul); lyricDisplay.style.display='block'; } else { lyricDisplay.style.display='none'; }
            } else { lyricDisplay.style.display='none'; }
          }

          // start sync (YT or fallback)
          if(window._lyricInterval) { clearInterval(window._lyricInterval); window._lyricInterval = null; }
          lyricStartRef = Date.now();
          if(isYouTube){
            if(window._ytPlayer){ try{ window._ytPlayer.destroy(); }catch(e){} window._ytPlayer = null; }
            iframe.id = 'ytplayer-' + Date.now();
            function loadYouTubeAPI(){ return new Promise((resolve)=>{ if(window.YT && window.YT.Player){ resolve(window.YT); return; } const prev = window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady = function(){ if(prev) prev(); resolve(window.YT); }; const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); }); }
            try{
              await loadYouTubeAPI();
              window._ytPlayer = new YT.Player(iframe.id, { events: { onReady: function(e){ try{ if(currentStart) e.target.seekTo(Number(currentStart), true); }catch(_){} try{ e.target.playVideo(); }catch(_){} if(window._lyricInterval){ clearInterval(window._lyricInterval); window._lyricInterval = null; } if(lyricLines && lyricLines.length>0){ window._lyricInterval = setInterval(function(){ try{ const now = (window._ytPlayer && typeof window._ytPlayer.getCurrentTime==='function') ? window._ytPlayer.getCurrentTime() : ((Date.now() - lyricStartRef) / 1000) + (currentStart || 0); updateLyricForTime(now); }catch(e){} }, 250); } }, onStateChange: function(e){ try{ if(e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED){ const t = window._ytPlayer.getCurrentTime(); updateLyricForTime(t); } }catch(_){} } } });
            }catch(e){ if(lyricLines && lyricLines.length>0){ window._lyricInterval = setInterval(function(){ const nowSec = ((Date.now() - lyricStartRef) / 1000) + (currentStart || 0); try{ updateLyricForTime(nowSec); }catch(e){} }, 250); } }
          } else {
            if(lyricLines && lyricLines.length>0){ window._lyricInterval = setInterval(function(){ const nowSec = ((Date.now() - lyricStartRef) / 1000) + (currentStart || 0); try{ updateLyricForTime(nowSec); }catch(e){} }, 250); }
          }

          // key handler
          const keyHandler = function(e){ if(!panel.contains(iframe)) return; if(e.key === 'ArrowLeft'){ e.preventDefault(); setStart(Math.max(0, currentStart - 5)); } else if(e.key === 'ArrowRight'){ e.preventDefault(); setStart(currentStart + 5); } else if(e.key === 's' || e.key === 'S'){ e.preventDefault(); promptForTime(); } };
          window._trackKeyHandler = keyHandler; document.addEventListener('keydown', window._trackKeyHandler);

          // helper to change start
          function setStart(sec){ currentStart = Math.max(0, Math.floor(sec)); iframe.src = buildSrc(embed, currentStart); }
          function promptForTime(){ const resp = window.prompt('Enter start time (mm:ss or seconds)', '00:00'); if(!resp) return; const parts = resp.split(':').map(s=>s.trim()); let sec = 0; if(parts.length===1) sec = parseInt(parts[0],10) || 0; else sec = (parseInt(parts[0],10)||0)*60 + (parseInt(parts[1],10)||0); setStart(sec); }
        }

        // attach listeners
        document.querySelectorAll('.track-btn').forEach(btn => btn.addEventListener('click', function(){ loadTrack(btn); }));

        // prev / next navigation handlers (use loadTrack to avoid .click conflicts)
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        function getTrackButtons(){ return Array.from(document.querySelectorAll('.track-btn')); }
        function goToTrack(offset){ const tracks = getTrackButtons(); if(tracks.length === 0) return; let current = window._currentTrackBtn || tracks[0]; let idx = tracks.indexOf(current); if(idx === -1) idx = 0; let nextIdx = (idx + offset + tracks.length) % tracks.length; const target = tracks[nextIdx]; if(target){ target.focus(); loadTrack(target); } }
        if(prevBtn) prevBtn.addEventListener('click', ()=> goToTrack(-1));
        if(nextBtn) nextBtn.addEventListener('click', ()=> goToTrack(1));
  
        // auto-load from URL `?track=...` if present
        try{
          const params = new URLSearchParams(window.location.search);
          const t = params.get('track');
          if(t){
            const esc = (window.CSS && typeof CSS.escape === 'function') ? CSS.escape(t) : t;
            const btn = document.querySelector('.track-btn[data-id="' + esc + '"]') || document.querySelector('.track-btn[data-id="' + t + '"]');
            if(btn) setTimeout(()=> loadTrack(btn), 60);
          }
        }catch(e){}
        
        // Brand button: navigate back to the site index
        try{
          const brandBtn = document.querySelector('.layer-btn');
          if(brandBtn){ brandBtn.addEventListener('click', ()=> { window.location.href = 'collection_page.html'; }); }
        }catch(e){}
        });
      </script>
<script>
(function(){
  var BASE_W=1920, BASE_H=1080;
  function rescale(){
    var el=document.querySelector('.slide-16-9-music-page'); if(!el) return;
    var s=window.innerWidth/BASE_W;
    el.style.transform='scale('+s+')';
    el.style.width=BASE_W+'px'; el.style.height=BASE_H+'px';
    document.body.style.width=Math.ceil(BASE_W*s)+'px';
    document.body.style.height=Math.ceil(BASE_H*s)+'px';
  }
  window.addEventListener('resize', rescale);
  window.addEventListener('DOMContentLoaded', rescale);
  rescale();
})();
</script>
      </body>
      </html>
