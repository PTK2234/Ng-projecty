<script>
document.addEventListener('DOMContentLoaded', function(){
  const embedDisplay = document.getElementById('embed-display');
  if(!embedDisplay) return;
  const panel = embedDisplay.querySelector('.embed-panel');
  const placeholder = embedDisplay.querySelector('.placeholder-img');

    // cleanup function to clear previous player, intervals and handlers
    function cleanupPrevious(){
      try{ if(window._lyricInterval){ clearInterval(window._lyricInterval); window._lyricInterval = null; } }catch(e){}
      try{ if(window._ytPlayer){ window._ytPlayer.destroy(); window._ytPlayer = null; } }catch(e){}
      try{ if(window._trackKeyHandler){ document.removeEventListener('keydown', window._trackKeyHandler); window._trackKeyHandler = null; } }catch(e){}
      try{ const ld = document.getElementById('lyric-display'); if(ld) ld.innerHTML = ''; }catch(e){}
      // clear embed panel content
      try{ panel.innerHTML = ''; }catch(e){}
    }

  
        // central track loader to avoid duplicate handlers/conflicts
        async function loadTrack(btn){
          if(!btn) return;
          // mark current track early
          window._currentTrackBtn = btn;
          // cleanup previous state
          cleanupPrevious();

          // populate track info panel
          const infoPanel = document.getElementById('track-info-panel');
          const infoText = document.getElementById('track-info-text');
          const infoImg = document.getElementById('track-info-img');
          if(infoPanel){
            const info = btn.getAttribute('data-info') || '';
            const img = btn.getAttribute('data-info-img') || '';
            if(infoText) infoText.textContent = info;
            if(infoImg){ infoImg.src = img; infoImg.alt = btn.getAttribute('aria-label') || 'Track artwork'; }
          }

          const embed = btn.getAttribute('data-embed') || '';
          const isYouTube = /youtube\.com\/embed|youtu\.be/.test(embed);
          panel.setAttribute('aria-hidden', 'false');
          if(!embed){ panel.textContent = (typeof I18N !== 'undefined' && I18N[currentLang] && I18N[currentLang].no_embed) ? I18N[currentLang].no_embed : 'No embed available for this track.'; return; }

          if(placeholder) placeholder.style.display = 'none';

          const iframe = document.createElement('iframe');
          iframe.className = 'embed-iframe';

          // lyric synchronization helper
          let currentLyricIndex = -1;
          function updateLyricForTime(nowSec){
            if(!lyricLines || lyricLines.length===0) return;
            let i = lyricLines.length-1;
            for(let j=0;j<lyricLines.length;j++){
              if(nowSec < lyricLines[j].time){ i = Math.max(0,j-1); break; }
              if(j===lyricLines.length-1) i = lyricLines.length-1;
            }
            if(i !== currentLyricIndex){
              const list = lyricDisplay.querySelectorAll('.lyric-line');
              if(list[currentLyricIndex]) list[currentLyricIndex].classList.remove('current');
              if(list[i]){
                list[i].classList.add('current');
                // Scroll the lyric container only, avoid scrolling the whole page
                const ul = lyricDisplay.querySelector('.lyric-list');
                if(ul){
                  const target = list[i];
                  const offset = target.offsetTop - (ul.clientHeight / 2) + (target.clientHeight / 2);
                  try{ ul.scrollTo({ top: offset, behavior: 'smooth' }); }catch(e){ ul.scrollTop = offset; }
                }
              }
              currentLyricIndex = i;
            }
          }

          // initialize start
          let currentStart = 0;
          const ds = btn.getAttribute('data-start');
          if(ds){ const n = parseInt(ds,10); if(!isNaN(n) && n>0) currentStart = n; }

          function buildSrc(baseEmbed, startSec){
            const isYT = /youtube\.com\/embed|youtu\.be/.test(baseEmbed);
            try{
              const u = new URL(baseEmbed);
              u.searchParams.set('autoplay','1'); if(isYT) u.searchParams.set('enablejsapi','1');
              if(startSec && startSec>0) u.searchParams.set('start', String(Math.floor(startSec))); else u.searchParams.delete('start');
              return u.toString();
            }catch(e){ const parts = baseEmbed.split('?'); const base = parts[0]; const params = new URLSearchParams(parts[1]||''); params.set('autoplay','1'); if(isYT) params.set('enablejsapi','1'); if(startSec && startSec>0) params.set('start', String(Math.floor(startSec))); else params.delete('start'); return base + '?' + params.toString(); }
          }

          iframe.src = buildSrc(embed, currentStart);
          iframe.setAttribute('frameborder','0'); iframe.setAttribute('allow','autoplay; encrypted-media'); iframe.setAttribute('allowfullscreen','');
          panel.appendChild(iframe);

          // render lyrics
          const lyricDisplay = document.getElementById('lyric-display');
          let lyricLines = [];
          let lyricStartRef = Date.now();
          if(lyricDisplay){
            lyricDisplay.innerHTML = '';
            let raw = '';
            const lrcPath = btn.getAttribute('data-lrc');
            // try language-specific lyric file when available (e.g., song.en.lrc)
            async function fetchLrcForPath(path){ try{ const r = await fetch(path); if(r.ok) return await r.text(); }catch(e){} return null; }
            if(lrcPath){
              if(currentLang === 'en'){
                const alt = lrcPath.replace(/\.lrc$/i, '') + '.en.lrc';
                raw = await fetchLrcForPath(alt) || await fetchLrcForPath(lrcPath) || '';
              } else {
                raw = await fetchLrcForPath(lrcPath) || '';
              }
            }
            if(!raw) raw = btn.getAttribute('data-lyrics') || btn.getAttribute('data-lyric') || '';
            if(raw){
              function parseLRC(text){ const lines = text.split(/\r?\n/).filter(Boolean); const out = []; const re = /\[(\d+):(\d+(?:\.\d+)?)\](.*)/; for(const l of lines){ const m = l.match(re); if(m){ const mm = parseInt(m[1],10)||0; const ss = parseFloat(m[2])||0; const t = mm*60 + ss; out.push({time:t,text:m[3].trim()}); } else if(l.trim()){ out.push({time:0,text:l.trim()}); } } out.sort((a,b)=>a.time-b.time); return out; }
              lyricLines = parseLRC(raw);
              if(lyricLines.length>0){ const ul = document.createElement('ul'); ul.className='lyric-list'; lyricLines.forEach((ln)=>{ const li = document.createElement('li'); li.className='lyric-line'; li.setAttribute('data-time', String(ln.time)); const mm = String(Math.floor(ln.time/60)).padStart(2,'0'); const ss = String(Math.floor(ln.time%60)).padStart(2,'0'); li.innerHTML = `<span class="time">${mm}:${ss}</span><span class="text">${ln.text}</span>`; ul.appendChild(li); }); lyricDisplay.appendChild(ul); lyricDisplay.style.display='block'; } else { lyricDisplay.style.display='none'; }
            } else { lyricDisplay.style.display='none'; }
          }

          // start sync (YT or fallback)
          if(window._lyricInterval) { clearInterval(window._lyricInterval); window._lyricInterval = null; }
          lyricStartRef = Date.now();
          if(isYouTube){
            if(window._ytPlayer){ try{ window._ytPlayer.destroy(); }catch(e){} window._ytPlayer = null; }
            iframe.id = 'ytplayer-' + Date.now();
            function loadYouTubeAPI(){ return new Promise((resolve)=>{ if(window.YT && window.YT.Player){ resolve(window.YT); return; } const prev = window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady = function(){ if(prev) prev(); resolve(window.YT); }; const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); }); }
            try{
              await loadYouTubeAPI();
              window._ytPlayer = new YT.Player(iframe.id, { events: { onReady: function(e){ try{ if(currentStart) e.target.seekTo(Number(currentStart), true); }catch(_){} try{ e.target.playVideo(); }catch(_){} if(window._lyricInterval){ clearInterval(window._lyricInterval); window._lyricInterval = null; } if(lyricLines && lyricLines.length>0){ window._lyricInterval = setInterval(function(){ try{ const now = (window._ytPlayer && typeof window._ytPlayer.getCurrentTime==='function') ? window._ytPlayer.getCurrentTime() : ((Date.now() - lyricStartRef) / 1000) + (currentStart || 0); updateLyricForTime(now); }catch(e){} }, 250); } }, onStateChange: function(e){ try{ if(e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED){ const t = window._ytPlayer.getCurrentTime(); updateLyricForTime(t); } }catch(_){} } } });
            }catch(e){ if(lyricLines && lyricLines.length>0){ window._lyricInterval = setInterval(function(){ const nowSec = ((Date.now() - lyricStartRef) / 1000) + (currentStart || 0); try{ updateLyricForTime(nowSec); }catch(e){} }, 250); } }
          } else {
            if(lyricLines && lyricLines.length>0){ window._lyricInterval = setInterval(function(){ const nowSec = ((Date.now() - lyricStartRef) / 1000) + (currentStart || 0); try{ updateLyricForTime(nowSec); }catch(e){} }, 250); }
          }

          // key handler
          const keyHandler = function(e){ if(!panel.contains(iframe)) return; if(e.key === 'ArrowLeft'){ e.preventDefault(); setStart(Math.max(0, currentStart - 5)); } else if(e.key === 'ArrowRight'){ e.preventDefault(); setStart(currentStart + 5); } else if(e.key === 's' || e.key === 'S'){ e.preventDefault(); promptForTime(); } };
          window._trackKeyHandler = keyHandler; document.addEventListener('keydown', window._trackKeyHandler);

          // helper to change start
          function setStart(sec){ currentStart = Math.max(0, Math.floor(sec)); iframe.src = buildSrc(embed, currentStart); }
          function promptForTime(){ const promptText = (typeof I18N !== 'undefined' && I18N[currentLang] && I18N[currentLang].enter_start_prompt) ? I18N[currentLang].enter_start_prompt : 'Enter start time (mm:ss or seconds)'; const resp = window.prompt(promptText, '00:00'); if(!resp) return; const parts = resp.split(':').map(s=>s.trim()); let sec = 0; if(parts.length===1) sec = parseInt(parts[0],10) || 0; else sec = (parseInt(parts[0],10)||0)*60 + (parseInt(parts[1],10)||0); setStart(sec); }
        }

        // attach listeners
        document.querySelectorAll('.track-btn').forEach(btn => btn.addEventListener('click', function(){ loadTrack(btn); }));

        // prev / next navigation handlers (use loadTrack to avoid .click conflicts)
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        function getTrackButtons(){ return Array.from(document.querySelectorAll('.track-btn')); }
        function goToTrack(offset){ const tracks = getTrackButtons(); if(tracks.length === 0) return; let current = window._currentTrackBtn || tracks[0]; let idx = tracks.indexOf(current); if(idx === -1) idx = 0; let nextIdx = (idx + offset + tracks.length) % tracks.length; const target = tracks[nextIdx]; if(target){ target.focus(); loadTrack(target); } }
        if(prevBtn) prevBtn.addEventListener('click', ()=> goToTrack(-1));
        if(nextBtn) nextBtn.addEventListener('click', ()=> goToTrack(1));

        // Toggle track info panel with group-left button and update icon
        const groupLeftBtn = document.querySelector('.group-left');
        const trackInfoPanel = document.getElementById('track-info-panel');
        if(groupLeftBtn && trackInfoPanel){
          const icon = groupLeftBtn.querySelector('.group-toggle-icon') || groupLeftBtn.querySelector('img');
          // set initial icon according to panel visibility
          try{ const visible = trackInfoPanel.style.display !== 'none' && trackInfoPanel.style.display !== '' && trackInfoPanel.style.display !== 'none'; if(icon && icon.dataset){ icon.src = (visible ? icon.dataset.on : icon.dataset.off) || icon.src; } }catch(e){}
          groupLeftBtn.addEventListener('click', function(){
            if(!window._currentTrackBtn){ return; }
            // toggle panel
            trackInfoPanel.style.display = (trackInfoPanel.style.display === 'none' || trackInfoPanel.style.display === '') ? 'block' : 'none';
            // update icon based on new visibility
            try{ const nowVisible = trackInfoPanel.style.display === 'block'; if(icon && icon.dataset){ icon.src = (nowVisible ? icon.dataset.on : icon.dataset.off) || icon.src; } }catch(e){}
          });
        }

        // Toggle dropdown panel with group-right button and update its icon
        const groupRightBtn = document.querySelector('.group-right');
        const dropdown = document.getElementById('dropdown-panel');
        if(groupRightBtn && dropdown){
          const rightIcon = groupRightBtn.querySelector('.group-right-icon') || groupRightBtn.querySelector('img');
          // set initial icon based on dropdown visibility (class-based)
          try{ const visible = dropdown.classList.contains('open'); if(rightIcon && rightIcon.dataset){ rightIcon.src = visible ? rightIcon.dataset.on : rightIcon.dataset.off; } }catch(e){}
          groupRightBtn.addEventListener('click', function(e){
            e.stopPropagation();
            const isOpen = dropdown.classList.contains('open');
            if(isOpen){ dropdown.classList.remove('open'); dropdown.setAttribute('aria-hidden','true'); } else { dropdown.classList.add('open'); dropdown.setAttribute('aria-hidden','false'); }
            try{ if(rightIcon && rightIcon.dataset){ rightIcon.src = isOpen ? rightIcon.dataset.off : rightIcon.dataset.on; } }catch(e){}
          });
          // close when clicking outside
          document.addEventListener('click', function(ev){ if(!groupRightBtn.contains(ev.target) && !dropdown.contains(ev.target)){ dropdown.classList.remove('open'); dropdown.setAttribute('aria-hidden','true'); try{ if(rightIcon && rightIcon.dataset){ rightIcon.src = rightIcon.dataset.off; } }catch(e){} } });
        }

        // Dropdown buttons: open YouTube / Spotify for the current track
        const btnYouTube = document.getElementById('btn-youtube');
        const btnSpotify = document.getElementById('btn-spotify');

        // show a small visible toast for debugging (also logs to console)
        function showDebug(msg, timeout){
          try{
            console.log(msg);
            const t = document.getElementById('debug-toast');
            if(t){ t.textContent = msg; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(()=>{ t.style.display = 'none'; }, timeout || 2200); }
          }catch(e){}
        }

        // robust open-in-new-tab helper using an anchor (avoids popup quirks)
        function openUrlInNewTab(url){
          if(!url) return false;
          try{
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(()=> a.remove(), 1000);
            return true;
          }catch(e){
            try{ window.open(url, '_blank'); return true; }catch(e2){ return false; }
          }
        }

        function getYouTubeWatchUrl(){
          if(!window._currentTrackBtn) return '';
          const embed = window._currentTrackBtn.getAttribute('data-embed') || '';
          const m = embed.match(/youtube\.com\/embed\/([^?&#]+)/);
          return m ? 'https://www.youtube.com/watch?v=' + m[1] : embed;
        }

        if(btnYouTube){
          btnYouTube.addEventListener('click', function(e){
            e.stopPropagation();
            // fallback to first track if none selected
            if(!window._currentTrackBtn){ const first = document.querySelector('.track-btn'); if(first){ window._currentTrackBtn = first; showDebug('No track selected — using first track'); } }
            const url = getYouTubeWatchUrl();
            showDebug('YouTube button clicked — url: ' + (url || '<none>'));
            if(url) openUrlInNewTab(url);
          });
        }

        if(btnSpotify){
          btnSpotify.addEventListener('click', function(e){
            e.stopPropagation();
            if(!window._currentTrackBtn){ const first = document.querySelector('.track-btn'); if(first){ window._currentTrackBtn = first; showDebug('No track selected — using first track'); } }
            const url = (window._currentTrackBtn && window._currentTrackBtn.getAttribute('data-spotify')) || '';
            showDebug('Spotify button clicked — url: ' + (url || '<none>'));
            if(url) openUrlInNewTab(url); else showDebug('No Spotify URL configured for this track');
          });
        }
  
        // auto-load from URL `?track=...` if present
        try{
          const params = new URLSearchParams(window.location.search);
          const t = params.get('track');
          if(t){
            const esc = (window.CSS && typeof CSS.escape === 'function') ? CSS.escape(t) : t;
            const btn = document.querySelector('.track-btn[data-id="' + esc + '"]') || document.querySelector('.track-btn[data-id="' + t + '"]');
            if(btn) setTimeout(()=> loadTrack(btn), 60);
          }
        }catch(e){}
        
        // Brand button: navigate back to the site index
        try{
          const brandBtn = document.querySelector('.layer-btn');
          if(brandBtn){ brandBtn.addEventListener('click', ()=> { window.location.href = 'collection_page.html'; }); }
        }catch(e){}

        // --- Internationalization (EN/VI) switch ---
        const I18N = {
          en: {
            title: 'Landing Page',
            header_actions: 'Header actions',
            brand: 'Brand',
            prev_btn: 'Previous track',
            next_btn: 'Next track',
            no_embed: 'No embed available for this track.',
            enter_start_prompt: 'Enter start time (mm:ss or seconds)'
          },
          vi: {
            title: 'Trang chính',
            header_actions: 'Hành động',
            brand: 'Thương hiệu',
            prev_btn: 'Bài trước',
            next_btn: 'Bài tiếp theo',
            no_embed: 'Không có nhúng cho bài hát này.',
            enter_start_prompt: 'Nhập thời gian bắt đầu (mm:ss hoặc giây)'
          }
        };

        // elements we will translate (do NOT include track elements)
        const i18nTargets = [
          {sel: '.language-btn', key: 'header_actions'},
          {sel: '.layer-btn', key: 'brand'},
          {sel: '.prev-btn', key: 'prev_btn'},
          {sel: '.next-btn', key: 'next_btn'}
        ];

        let currentLang = localStorage.getItem('site_lang') || 'vi';
        function updateLangIcons(){
          const btn = document.querySelector('.language-btn');
          if(!btn) return;
          const eng = btn.querySelector('.eng');
          const vie = btn.querySelector('.vie');
          if(eng) eng.style.display = (currentLang === 'en') ? 'inline' : 'none';
          if(vie) vie.style.display = (currentLang === 'vi') ? 'inline' : 'none';
        }
        function applyLang(lang){
          currentLang = (lang === 'en') ? 'en' : 'vi';
          localStorage.setItem('site_lang', currentLang);
          // document title
          try{ document.title = I18N[currentLang].title || document.title; }catch(e){}
          // attributes
          i18nTargets.forEach(t => {
            const el = document.querySelector(t.sel);
            if(!el) return;
            const txt = I18N[currentLang][t.key] || '';
            if(el.hasAttribute('aria-label')) el.setAttribute('aria-label', txt);
            if(el.hasAttribute('title')) el.title = txt;
          });
          updateLangIcons();
        }

        // toggle handler bound to the .language-btn
        try{
          const btn = document.querySelector('.language-btn');
          if(btn){ btn.style.cursor = 'pointer'; btn.addEventListener('click', function(e){ e.stopPropagation(); const next = (currentLang === 'en') ? 'vi' : 'en'; applyLang(next); }); }
        }catch(e){}

        // apply initial language
        try{ applyLang(currentLang); }catch(e){}
        
        // When language changes, reload current track to pick up translated lyrics (if available)
        // Note: this will recreate the iframe/player and restart playback.
        const originalApplyLang = applyLang;
        applyLang = function(lang){
          originalApplyLang(lang);
          try{ if(window._currentTrackBtn){ // re-load the same track so lyrics reflect selected language
            setTimeout(()=>{ try{ loadTrack(window._currentTrackBtn); }catch(e){} }, 50);
          } }catch(e){}
        };
        });
      </script>
<script>
(function(){
  var BASE_W=1920, BASE_H=1080;
  function rescale(){
    var el=document.querySelector('.slide-16-9-music-page'); if(!el) return;
    // preserve aspect ratio and COVER the viewport so both dimensions are filled
    var s = Math.max(window.innerWidth/BASE_W, window.innerHeight/BASE_H);
    el.style.transform = 'scale(' + s + ')';
    el.style.left = '0px'; el.style.top = '0px';
    el.style.width = BASE_W + 'px'; el.style.height = BASE_H + 'px';
    var scaledW = Math.ceil(BASE_W * s);
    var scaledH = Math.ceil(BASE_H * s);
    document.documentElement.style.width = scaledW + 'px';
    document.documentElement.style.height = scaledH + 'px';
    document.body.style.width = scaledW + 'px';
    document.body.style.height = scaledH + 'px';
  }
  window.addEventListener('resize', rescale);
  window.addEventListener('DOMContentLoaded', rescale);
  rescale();
})();
</script>
