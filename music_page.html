<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Landing Page</title>
	   <link rel="stylesheet" href="music_page.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Overpass+Mono:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
  html, body { margin: 0; padding: 0; background: #fff; height: 100%; min-height: 100vh; overflow: auto; }
  body { -webkit-font-smoothing:antialiased; -webkit-overflow-scrolling: touch; }
  /* scale from top-left and allow scrolling to reach edges */
  .slide-16-9-music-page { transform-origin: top left; position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // trigger page enter animation
            document.body.classList.add('page-enter');
            setTimeout(function(){ document.body.classList.add('loaded'); document.body.classList.remove('page-exit'); }, 20);
        });
    </script>
<div class="slide-16-9-music-page">
  <div class="ellipse-10"></div>
  <div class="rectangle-1"></div>
  <img class="layer-1" src="Assest/layer-10.svg" />
  <img class="music" src="Assest/music3.svg" />
  <img class="mockup-1-x-1" src="Assest/mockup-1-x-10.png" />
  <img class="x-32" src="Assest/x-320.svg" />
  <div class="rectangle-13"></div>
  <div class="rectangle-14"></div>
  <div class="c-u-chuy-n-b-n-m-a-m-a-xu-n-vi-t-nam">
    <span data-i18n="story_title">Câu Chuyện</span>
    <br  />
    <span data-i18n="story_label">Bốn mùa:</span>
    <br />
    <span data-i18n="story_season">Mùa Xuân</span>
    <br />
    <span data-i18n="story_country">Việt Nam</span>
  </div>
  
  <button class="track-btn" aria-label="Play Đón xuân" data-id="track-1">
    <img class="rectangle-2" src="Assest/rectangle-20.png" />
    <div class="group-14">
      <div class="n-xu-n">Đón xuân</div>
      <div class="nh-qu-nh">Như Quỳnh</div>
    </div>
  </button>

  <button class="track-btn" aria-label="Play Xuân đã về" data-id="track-2">
    <img class="rectangle-3" src="Assest/rectangle-30.png" />
    <div class="group-13">
      <div class="xu-n-v">Xuân đã về</div>
      <div class="thanh-lan">Thanh Lan</div>
    </div>
  </button>

  <button class="track-btn" aria-label="Play Xuân và tuổi trẻ" data-id="track-3">
    <img class="rectangle-4" src="Assest/rectangle-40.png" />
    <div class="group-12">
      <div class="xu-n-v-tu-i-tr">Xuân và tuổi trẻ</div>
      <div class="th-i-thanh">Thái Thanh</div>
    </div>
  </button>

  <button class="track-btn" aria-label="Play Mùa xuân đầu tiên" data-id="track-4">
    <img class="rectangle-6" src="Assest/rectangle-60.png" />
    <div class="group-11">
      <div class="m-a-xu-n-u-ti-n">Mùa xuân đầu tiên</div>
      <div class="thanh-th-y">Thanh Thúy</div>
    </div>
  </button>

  <button class="track-btn" aria-label="Play Thì thầm mùa xuân" data-id="track-5">
    <img class="rectangle-7" src="Assest/rectangle-70.png" />
    <div class="group-10">
      <div class="th-th-m-m-a-xu-n">Thì thầm mùa xuân</div>
      <div class="m-linh">Mỹ Linh</div>
    </div>
  </button>

  <button class="track-btn" aria-label="Play Lắng nghe mùa xuân về" data-id="track-6">
    <img class="rectangle-8" src="Assest/rectangle-80.png" />
    <div class="group-9">
      <div class="l-ng-nghe-m-a-xu-n-v">Lắng nghe mùa xuân về</div>
      <div class="ph-ng-ph-ng-th-o">Phương Phương Thảo</div>
    </div>
  </button>

  <button class="layer-btn" aria-label="Brand">
    <img class="layer-12" src="Assest/layer-11.svg" alt="brand">
  </button>
  
  <button class="language-btn" aria-label="Toggle language" type="button">
    <img class="music2" src="Assest/music0.svg" />
    <img class="eng" src="Assest/eng.svg" alt="English" />
    <img class="vie" src="Assest/vie.svg" alt="Vietnamese" />
  </button>

  <div class="ellipse-4"></div>
  <div class="ellipse-5"></div>
  <div class="ellipse-6"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  document.querySelectorAll('.track-btn').forEach(btn => {
    btn.addEventListener('click', function(){
      const id = btn.getAttribute('data-id') || '';
      const href = 'music_page_play.html' + (id ? ('?track=' + encodeURIComponent(id)) : '');
      window.location.href = href;
    });
  });

  // Brand button: navigate back to the site index
  const brandBtn = document.querySelector('.layer-btn');
    if (brandBtn) {
    brandBtn.addEventListener('click', function(){
      window.location.href = 'collection_page.html';
    });
  }
});
</script>
<!-- I18N: EN/VI toggle -->
<script>
  (function(){
    const I18N = {
      en: { title:'Music - Spring', story_title:'Four seasons:', story_label:'Vietnam', story_season:'Spring', story_country:'Story' },
      vi: { title:'Âm nhạc - Mùa Xuân', story_title:'Câu Chuyện', story_label:'Bốn mùa:', story_season:'Mùa Xuân', story_country:'Việt Nam' }
    };
    let currentLang = localStorage.getItem('site_lang') || 'vi';
    function updateLangIcons(){
      const btn = document.querySelector('.language-btn');
      if(!btn) return;
      const eng = btn.querySelector('.eng');
      const vie = btn.querySelector('.vie');
      if(eng) eng.style.display = (currentLang === 'en') ? 'inline' : 'none';
      if(vie) vie.style.display = (currentLang === 'vi') ? 'inline' : 'none';
    }
    function applyLang(lang){
      currentLang = (lang==='en')?'en':'vi';
      localStorage.setItem('site_lang', currentLang);
      try{ document.title = I18N[currentLang].title || document.title; }catch(e){}
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const key = el.getAttribute('data-i18n'); if(!key) return;
        el.textContent = (I18N[currentLang] && I18N[currentLang][key]) ? I18N[currentLang][key] : el.textContent;
      });
      const brand = document.querySelector('.layer-btn');
      if(brand && brand.hasAttribute('aria-label')) brand.setAttribute('aria-label', (currentLang==='en')?'Brand':'Thương hiệu');
      updateLangIcons();
    }
    try{
      const btn = document.querySelector('.language-btn');
      if(btn){
        btn.style.cursor = 'pointer';
        btn.addEventListener('click', function(e){ e.stopPropagation(); const next = (currentLang==='en') ? 'vi' : 'en'; applyLang(next); });
      }
      applyLang(currentLang);
    }catch(e){}
  })();
</script>
<script>
  (function(){
  var BASE_W=1920, BASE_H=1080;
  function rescale(){
    var el=document.querySelector('.slide-16-9-music-page'); if(!el) return;
    // preserve aspect ratio and COVER the viewport so both dimensions are filled
    // use top-left origin and set body size to scaled design so scrollbars appear
    var s = Math.max(window.innerWidth/BASE_W, window.innerHeight/BASE_H);
    el.style.transform = 'scale(' + s + ')';
    el.style.left = '0px'; el.style.top = '0px';
    el.style.width = BASE_W + 'px'; el.style.height = BASE_H + 'px';
    var scaledW = Math.ceil(BASE_W * s);
    var scaledH = Math.ceil(BASE_H * s);
    document.documentElement.style.width = scaledW + 'px';
    document.documentElement.style.height = scaledH + 'px';
    document.body.style.width = scaledW + 'px';
    document.body.style.height = scaledH + 'px';
  }
  window.addEventListener('resize', rescale);
  window.addEventListener('DOMContentLoaded', rescale);
  rescale();
})();
</script>
</body>
</html>
