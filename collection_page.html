<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Collection - Mùa Xuân</title>
  <link rel="stylesheet" href="collection.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Overpass+Mono:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body.page-enter { opacity: 0; }
    body.page-enter.loaded { opacity: 1; transition: opacity 600ms ease; }
    html, body { margin: 0; padding: 0; background: #fff; height: 100%; min-height: 100vh; overflow: auto; scrollbar-width: none; -ms-overflow-style: none; }
    body { -webkit-font-smoothing:antialiased; -webkit-overflow-scrolling:touch; }
    /* hide scrollbars but keep scrolling */
    body::-webkit-scrollbar { width: 0; height: 0; }
    /* scale from top-left and allow scrolling to reach edges */
    .slide-16-9-collection-page { transform-origin: top left; position: absolute; left: 0; top: 0; }
  </style>
</head>
<body>
<script>
  // trigger page enter fade on load
  document.addEventListener('DOMContentLoaded', function(){
    document.body.classList.add('page-enter');
    setTimeout(function(){ document.body.classList.add('loaded'); }, 20);
  });
</script>
<div class="slide-16-9-collection-page">
  <div class="ellipse-11"></div>
  <div class="ellipse-12"></div>
  <div class="ellipse-14"></div>
  <div class="ellipse-4"></div>
  <div class="ellipse-5"></div>
  <div class="ellipse-6"></div>
  <div class="ellipse-112"></div>
  <div class="rectangle-13"></div>
  <div class="m-axu-n">
    <span>
      <span class="m-axu-n-span" data-i18n="collection_title">MÙA XUÂN</span>
    </span>
  </div>
  <div
    class="m-a-xu-n-l-m-a-c-a-nh-ng-n-hoa-m-i-nh-c-ng-l-m-a-ta-chi-m-nghi-m-c-i-c-m-i-b-n-du-ngo-n-playlist-xu-n-h-nh-tr-nh-c-m-x-c-t-m-t-th-i-qua-t-i-nh-ng-giai-i-u-b-n-ph-i-hi-n-i-n-t-ng-th-gi-n-th-l-ng-v-c-ng-c-i-ng-a-xem-hoa-c-ng-ch-ng-m-nh-nh"
    data-i18n="collection_intro"
  >

  </div>
  <div class="v-album"></div>
  <div class="t-nh-c-c-a-b-n"></div>
  <div class="v-ch-ng-m-nh"></div>
  
  <button class="layer-btn" aria-label="Brand">
    <img class="layer-1" src="Assest/layer-11.svg" />
  </button>
  <div class="rectangle-1"></div>
  <button class="language-btn" aria-label="Toggle language" type="button">
    <img class="music" src="Assest/music0.svg" />
    <img class="eng" src="Assest/eng.svg" alt="English" />
    <img class="vie" src="Assest/vie.svg" alt="Vietnamese" />
  </button>
  
  <img class="mockup-1-x-1" src="Assest/mockup-1-x-10.png" />
 
  <div class="ellipse-7"></div>
  <img class="sketch-1769442914819-1" src="Assest/sketch-1769442914819-10.png" />

  <button class="disk-btn" aria-label="Play album">
    <img class="disk-cv-1" src="Assest/mockup-1-x-10.png" alt="disk">
    <div class="ellipse-13" aria-hidden="true"></div>
    <img class="music2" src="Assest/music1.svg" alt="play icon">
  </button>
</div>
  <script>
    // Navigate to the play page when the disk button is clicked
    (function(){
      var btn = document.querySelector('.disk-btn');
      if(!btn) return;
      btn.addEventListener('click', function(){
        window.location.href = 'music_page.html';
      });
    })();
    
    // Brand button: navigate back to the site index
    (function(){
      var brand = document.querySelector('.layer-btn');
      if(!brand) return;
      brand.addEventListener('click', function(){ window.location.href = 'collection_page.html'; });
    })();
  </script>
  <!-- I18N: EN/VI toggle -->
  <script>
    (function(){
      const I18N = {
        en: { title:'Collection - Spring', collection_title: 'SPRING', collection_intro: 'Spring is a time for new blossoms, but also a time to look back at the old. Mâmlody invites you to "voyage" through our "Spring" playlist - an emotional journey from a time long ago to the bold, modern sounds of today.\n\n Just relax, let go, and enjoy the view from the saddle with us.' },
        vi: { title:'Collection - Mùa Xuân', collection_title: 'MÙA XUÂN', collection_intro: 'Mùa xuân là mùa của những nụ hoa mới nhú, cũng là mùa ta chiêm nghiệm cái cũ.Mời bạn "du ngoạn" playlist "Xuân" - hành trình cảm xúc từ một thời đã qua, tới những giai điệu, bản phối hiện đại ấn tượng.\n\nThư giãn, thả lỏng, và cùng "Cưỡi ngựa xem hoa" cùng chúng mình nhé.' }
      };
      let currentLang = localStorage.getItem('site_lang') || 'vi';
      function updateLangIcons(){
        const btn = document.querySelector('.language-btn');
        if(!btn) return;
        const eng = btn.querySelector('.eng');
        const vie = btn.querySelector('.vie');
        if(eng) eng.style.display = (currentLang === 'en') ? 'inline' : 'none';
        if(vie) vie.style.display = (currentLang === 'vi') ? 'inline' : 'none';
      }
      function applyLang(lang){
        currentLang = (lang==='en')?'en':'vi';
        localStorage.setItem('site_lang', currentLang);
        try{ document.title = I18N[currentLang].title || document.title; }catch(e){}
        document.querySelectorAll('[data-i18n]').forEach(el=>{ const key = el.getAttribute('data-i18n'); if(!key) return; const txt = (I18N[currentLang] && I18N[currentLang][key]) ? I18N[currentLang][key] : el.innerHTML; if(el.tagName.toLowerCase()==='div' && key==='collection_intro') el.innerHTML = (I18N[currentLang][key]||el.innerHTML).replace(/\n/g,'<br />'); else el.textContent = (I18N[currentLang][key]||el.textContent); });
        const brand = document.querySelector('.layer-btn'); if(brand && brand.hasAttribute('aria-label')) brand.setAttribute('aria-label', I18N[currentLang].brand || brand.getAttribute('aria-label'));
        updateLangIcons();
      }
      try{ const btn = document.querySelector('.language-btn'); if(btn){ btn.style.cursor='pointer'; btn.addEventListener('click', function(e){ e.stopPropagation(); const next = (currentLang==='en')?'vi':'en'; applyLang(next); }); } applyLang(currentLang); }catch(e){}
    })();
  </script>
<script>
(function(){
  var BASE_W=1920, BASE_H=1080;
  function rescale(){
    var el=document.querySelector('.slide-16-9-collection-page'); if(!el) return;
    var s = Math.max(window.innerWidth/BASE_W, window.innerHeight/BASE_H);
    el.style.transform = 'scale(' + s + ')';
    el.style.left = '0px'; el.style.top = '0px';
    el.style.width = BASE_W + 'px'; el.style.height = BASE_H + 'px';
    var scaledW = Math.ceil(BASE_W * s);
    var scaledH = Math.ceil(BASE_H * s);
    document.documentElement.style.width = scaledW + 'px';
    document.documentElement.style.height = scaledH + 'px';
    document.body.style.width = scaledW + 'px';
    document.body.style.height = scaledH + 'px';
  }
  window.addEventListener('resize', rescale);
  window.addEventListener('DOMContentLoaded', rescale);
  rescale();
})();
</script>
</body>
</html>
