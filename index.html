<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Landing Page</title>
	   <link rel="stylesheet" href="style.css">
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Overpass+Mono:wght@300;400;700&display=swap" rel="stylesheet">
	<style>
	  /* Page transition: fade in on load, fade out on navigate */
	  body.page-enter { opacity: 0; }
	  body.page-enter.loaded { opacity: 1; transition: opacity 600ms ease; }
	  body.page-exit { opacity: 0; transition: opacity 600ms ease; }
	</style>
</head>
<body>
	<!-- slide 1-->
	<div class="video-wrapper video">
			<video src="Assest/Animation Prototype (1).mp4" autoplay loop muted playsinline></video>
	</div>
	<!-- slide 2-->
	<div class="quote-wrapper quote1">
		<span id="quote1" class="quote" data-i18n="quote1">Như tiếng hí vang của chú ngựa chuẩn bị phi nước đại, những giai điệu sắc màu sẽ là bước khởi động hoàn hảo cho một năm đầy nhiệt huyết.</span>
	</div>
	<!-- slide 3-->
    <div class="quote-wrapper quote2">
        <span id="quote2" class="quote">
            <span class="quote-red" data-i18n="quote2_part1">Series Bốn mùa Việt Nam</span>
            <span class="quote-rest" data-i18n="quote2_part2"> được ra đời (bởi ba người bạn tuổi Ngọ) để đem tới một trải nghiệm Mùa Xuân Việt Nam, là khởi đầu của hành trình bước vào một năm mới.</span>
        </span>
    </div>
	<div class="dots">
		<span class="dot"></span>
		<span class="dot"></span>
		<span class="dot"></span>
	</div>

<!-- Consolidated scripts: page behaviour + I18N toggle -->
        <script>
        (function(){
            'use strict';

            /*
             Landing page behavior:
             - Handles page transitions (fade on load/exit)
             - Slideshow: video -> quote1 -> quote2 using class-driven crossfades
             - Click-to-navigate after slideshow
             - Language toggle (EN/VI) using data-i18n attributes
            */

            // Fade the page out and then navigate to the provided URL.
            function navigateWithTransition(url) {
                document.body.classList.remove('loaded');
                document.body.classList.add('page-exit');
                setTimeout(function(){ window.location.href = url; }, 620);
            }

            // Allow a single global document click to trigger navigation,
            // but only after `delayMs` has elapsed (prevents accidental early clicks).
            function startClickAfterDelay(delayMs) {
                var allowClick = false;
                function onDocClick(e) {
                    if (!allowClick) return;
                    document.removeEventListener('click', onDocClick, true);
                    navigateWithTransition('collection_page.html');
                }
                setTimeout(function() {
                    allowClick = true;
                    document.body.style.cursor = 'pointer';
                }, delayMs);
                document.addEventListener('click', onDocClick, true);
            }

            // DOM ready: initialize animations, slideshow state, and language toggle.
            document.addEventListener('DOMContentLoaded', function() {
                // trigger page enter animation
                document.body.classList.add('page-enter');
                setTimeout(function(){ document.body.classList.add('loaded'); document.body.classList.remove('page-exit'); }, 20);

                var videoWrapper = document.querySelector('.video-wrapper');
                var q1 = document.getElementById('quote1');
                var q2 = document.getElementById('quote2');

                // Helper: find the nearest .quote-wrapper ancestor for a quote element.
                var findQuoteWrapper = function(el) {
                    if (!el) return null;
                    return el.closest('.quote-wrapper') || el.parentElement || null;
                };

                var wrapper1 = findQuoteWrapper(q1);
                var wrapper2 = findQuoteWrapper(q2);

                // Ensure initial safe states (use class-based visibility)
                if (wrapper1) { wrapper1.classList.remove('visible'); wrapper1.style.pointerEvents = 'none'; wrapper1.style.zIndex = 2; }
                if (wrapper2) { wrapper2.classList.remove('visible'); wrapper2.style.pointerEvents = 'none'; wrapper2.style.zIndex = 2; }
                if (videoWrapper) { videoWrapper.classList.remove('hidden'); videoWrapper.style.zIndex = 1; }

                // timings (ms)
                var videoDelay = 3000; // delay before starting the first crossfade (3s)
                var quoteDisplay = 3000; // how long the first quote stays fully visible (3s)
                var fadeDuration = 1000; // must match CSS transition: opacity 1s

                // Start sequence: after videoDelay, crossfade video -> quote1.
                setTimeout(function() {
                    // ensure wrappers exist and are stacked above video
                    if (wrapper1) { wrapper1.style.zIndex = 3; }
                    if (wrapper2) { wrapper2.style.zIndex = 3; }
                    if (videoWrapper) { videoWrapper.style.zIndex = 1; }

                    // Simultaneously hide video and show quote1 to produce a synchronized crossfade.
                    if (videoWrapper) { videoWrapper.classList.add('hidden'); }
                    if (wrapper1) { wrapper1.classList.add('visible'); wrapper1.style.pointerEvents = 'auto'; }

                    // After quote1 has faded in and remained visible for `quoteDisplay`, crossfade to quote2.
                    setTimeout(function() {
                        if (wrapper1) { wrapper1.classList.remove('visible'); wrapper1.style.pointerEvents = 'none'; }
                        if (wrapper2 && wrapper2 !== wrapper1) { wrapper2.classList.add('visible'); wrapper2.style.pointerEvents = 'auto'; }

                        // Once quote2's fade completes, enable click-to-navigate after an additional safety delay.
                        setTimeout(function() {
                            startClickAfterDelay(3000);
                        }, fadeDuration);
                    }, fadeDuration + quoteDisplay);
                }, videoDelay);
            });

            /* I18N: EN/VI toggle (adds floating toggle if page has no header)
               - `I18N` stores translations keyed by `data-i18n` attributes.
               - `applyLang` writes translations to matching elements and persists choice.
               - `ensureToggle` creates a small top-right button to switch languages.
            */
                (function(){
                const I18N = {
                    en: {
                        title: 'Landing Page',
                        quote1: 'Like the neigh of a horse ready to gallop, colorful melodies are the perfect warm-up for a spirited year.',
                        quote2_part1: 'The Four Seasons of Vietnam series',
                        quote2_part2: ' was created to bring a Spring Vietnam experience — the start of a new year journey.'
                    },
                    vi: {
                        title: 'Trang chính',
                        quote1: 'Như tiếng hí vang của chú ngựa chuẩn bị phi nước đại, những giai điệu sắc màu sẽ là bước khởi động hoàn hảo cho một năm đầy nhiệt huyết.',
                        quote2_part1: 'Series Bốn mùa Việt Nam',
                        quote2_part2: ' được ra đời (bởi ba người bạn tuổi Ngọ) để đem tới một trải nghiệm Mùa Xuân Việt Nam, là khởi đầu của hành trình bước vào một năm mới.'
                    }
                };
                let currentLang = localStorage.getItem('site_lang') || 'vi';
                // Apply language strings to all elements with a `data-i18n` attribute.
                function applyLang(lang){
                    currentLang = (lang==='en') ? 'en' : 'vi';
                    localStorage.setItem('site_lang', currentLang);
                    try{ document.title = I18N[currentLang].title || document.title; }catch(e){}
                    document.querySelectorAll('[data-i18n]').forEach(el => {
                        const key = el.getAttribute('data-i18n');
                        if(!key) return;
                        const txt = (I18N[currentLang] && I18N[currentLang][key]) ? I18N[currentLang][key] : el.textContent;
                        el.textContent = txt;
                    });
                }

                // Create a floating language toggle button if one doesn't already exist.
                function ensureToggle(){
                    const existing = document.querySelector('.language-btn');
                    if(existing) return existing;
                    const btn = document.createElement('button');
                    btn.className='language-btn';
                    btn.style.position='fixed';
                    btn.style.top='12px';
                    btn.style.right='12px';
                    btn.style.zIndex='9999';
                    btn.style.border='none';
                    btn.style.background='transparent';
                    btn.style.padding='6px';
                    btn.setAttribute('aria-label','Toggle language');
                    const eng = document.createElement('img'); eng.className='eng'; eng.src='Assest/eng.svg'; eng.alt='ENG'; eng.style.width='28px'; eng.style.height='28px';
                    const vie = document.createElement('img'); vie.className='vie'; vie.src='Assest/vie.svg'; vie.alt='VIE'; vie.style.width='28px'; vie.style.height='28px';
                    btn.appendChild(eng); btn.appendChild(vie); document.body.appendChild(btn); return btn;
                }
                const toggleBtn = ensureToggle(); toggleBtn.style.cursor='pointer'; toggleBtn.addEventListener('click', function(e){ e.stopPropagation(); const next = (currentLang==='en')?'vi':'en'; applyLang(next); });
                try{ applyLang(currentLang); }catch(e){}
            })();

        })();
        </script>
